name: Render Video
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - run: python main.py
      - uses: actions/upload-artifact@v3
        with:
          name: video-files
          path: |
            *.jpg
            *.mp3
