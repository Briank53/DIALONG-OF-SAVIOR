name: Render Video
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow moviepy
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
