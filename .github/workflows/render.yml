name: Render Video
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render HD Video
        run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-video-hd
          path: final_video.mp4
